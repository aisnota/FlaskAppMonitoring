env:
  hubIp: "192.168.100.101"
  hubPort: "30090"
  clusterName: "cluster-2"

# 권한 설정 (이 부분이 확실해야 데이터를 긁어옵니다)
rbac:
  create: true
serviceAccounts:
  server:
    create: true
    name: "prom-agent-prometheus-server"

server:
  # 원격 전송
  remoteWrite:
    - url: "http://{{ .Values.env.hubIp }}:{{ .Values.env.hubPort }}/api/v1/write"
      write_relabel_configs: []
        # - source_labels: [__name__] # 모든 지표 이름 선택
        #   regex: (.*)               # 모든 지표 매칭
        #   target_label: cluster
        #   replacement: cluster-2
        #   action: replace

  global:
    external_labels:
      cluster: "cluster-2"
    scrape_interval: 15s

  # 볼륨 에러 방지
  persistentVolume:
    enabled: false
  emptyDir:
    sizeLimit: 512Mi

  # 기본 수집 기능 강제 활성화 (이 옵션들이 1을 수십 개로 바꿔줍니다)
  sidecarContainers: {}
  
  # 수집 설정 직접 주입
  extraScrapeConfigs: |
    - job_name: 'kubernetes-nodes'
      kubernetes_sd_configs:
        - role: node
    - job_name: 'kubernetes-cadvisor'
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        insecure_skip_verify: true
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      kubernetes_sd_configs:
        - role: node
      metrics_path: /metrics/cadvisor
    - job_name: 'kubernetes-service-endpoints'
      kubernetes_sd_configs:
        - role: endpoints

# 노드 엑스포터와 상태 메트릭 활성화
nodeExporter:
  enabled: true
kubeStateMetrics:
  enabled: true

alertmanager:
  enabled: false
pushgateway:
  enabled: false
  
