alertmanager:
  enabled: true
  alertmanagerSpec:
    # 파드가 생성되지 않을 때 강제로 복제본 개수를 지정합니다.
    replicas: 1
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'eks-scaler-webhook'
    receivers:
    - name: 'eks-scaler-webhook'
      webhook_configs:
      - url: 'http://192.168.100.101:8080/webhook'