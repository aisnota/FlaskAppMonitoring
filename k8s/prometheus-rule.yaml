apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: low-resource-threshold-test
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
  - name: bursting-rules
    rules:
    - alert: HighCpuUsageTest
      # CPU 사용량이 조금이라도 있으면 알람 (테스트용)
      expr: sum(node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate) > 0.001
      for: 10s
      labels:
        severity: critical
      annotations:
        summary: "On-premise 리소스 임계치 초과! EKS로 확장을 시작합니다."
