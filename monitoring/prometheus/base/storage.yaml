# Prometheus 데이터를 Ceph에 저장하기 위한 설정
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: rook-ceph-block
provisioner: rook-ceph.rbd.csi.ceph.com
parameters:
  clusterID: rook-ceph
  pool: replicapool
  imageFormat: "2"
  imageFeatures: layering
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data-pvc
  namespace: monitoring
spec:
  accessModes: [ "ReadWriteOnce" ]
  storageClassName: "rook-ceph-block" # 위에서 만든 storageClass 이름
  resources:
    requests:
      storage: 100Gi # 1.3TB 중 우선 100GB 할당